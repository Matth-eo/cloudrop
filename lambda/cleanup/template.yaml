AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Scheduled cleanup of expired Cloudrop files

Parameters:
  BucketName:
    Type: String
  TableName:
    Type: String

Resources:
  CleanupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../.build/cleanup/
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 300
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          AWS_S3_BUCKET_NAME: !Ref BucketName
          AWS_DYNAMODB_TABLE_NAME: !Ref TableName
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Scan, dynamodb:GetItem, dynamodb:DeleteItem]
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
            - Effect: Allow
              Action: s3:GetBucketVersioning
              Resource: !Sub arn:${AWS::Partition}:s3:::${BucketName}
            - Effect: Allow
              Action: s3:ListBucketVersions
              Resource: !Sub arn:${AWS::Partition}:s3:::${BucketName}
              Condition:
                StringLike:
                  s3:prefix: uploads/*
            - Effect: Allow
              Action: [s3:DeleteObject, s3:DeleteObjectVersion]
              Resource: !Sub arn:${AWS::Partition}:s3:::${BucketName}/uploads/*
      Events:
        CleanupSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Enabled: true
  CleanupLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CleanupFunction}
      RetentionInDays: 14

Outputs:
  CleanupFunctionName:
    Value: !Ref CleanupFunction
